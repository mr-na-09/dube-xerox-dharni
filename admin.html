<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-800">
            <div class="w-10 h-10 bg-sky-500/10 text-sky-400 rounded-2xl flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">Admin Control Hub</h1>
                <p class="text-xs text-slate-400">GitHub REST API Integration</p>
            </div>
        </div>

        <form id="admin-form" onsubmit="handleUpdate(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">GITHUB REPO OWNER</label>
                <input type="text" id="owner" required placeholder="e.g. mr-na-09" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">REPOSITORY NAME</label>
                <input type="text" id="repo" required placeholder="e.g. xerox-shop" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">PERSONAL ACCESS TOKEN (PAT)</label>
                <input type="password" id="token" required placeholder="ghp_XXXXXXXXXXXXXXXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm font-mono focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">SHOP STATUS</label>
                <select id="status" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500">
                    <option value="Open">Open Now</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>

            <button type="submit" id="btn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3.5 rounded-2xl transition text-sm shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> Sync & Push to GitHub
            </button>
        </form>

        <div id="msg" class="mt-4 text-xs text-center hidden font-medium"></div>
    </div>

    <script>
        async function handleUpdate(e) {
            e.preventDefault();
            const owner = document.getElementById('owner').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const token = document.getElementById('token').value.trim();
            const status = document.getElementById('status').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');

            msg.classList.remove('hidden', 'text-emerald-400', 'text-rose-400');
            msg.innerText = "Connecting to GitHub API...";
            btn.disabled = true;

            const path = "config.json";
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const payload = { shop_status: status, updated_at: new Date().toISOString() };

            try {
                let sha = "";
                const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const putRes = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Update shop status via Admin Portal",
                        content: btoa(JSON.stringify(payload, null, 2)),
                        sha: sha ? sha : undefined
                    })
                });

                if (putRes.ok) {
                    msg.classList.add('text-emerald-400');
                    msg.innerText = "Success! Repository synced successfully.";
                } else {
                    const err = await putRes.json();
                    throw new Error(err.message || "Authentication failed");
                }
            } catch (error) {
                msg.classList.add('text-rose-400');
                msg.innerText = "Error: " + error.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
