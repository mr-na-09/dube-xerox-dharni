<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Panel | Xerox Shop Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Top Control Bar -->
        <div class="flex flex-wrap justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8 shadow-2xl gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-500 rounded-2xl flex items-center justify-center text-slate-950 text-2xl font-black">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Full Website Admin Panel</h1>
                    <p class="text-xs text-slate-400">Website ki har ek cheez yahan se badlein</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="saveAllToGitHub()" id="save-btn" class="bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold px-6 py-3 rounded-xl text-sm shadow-xl shadow-amber-400/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Save All Changes
                </button>
            </div>
        </div>

        <!-- GitHub Connection Bar -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8">
            <h3 class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-4">1. GitHub Developer Access Token</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Owner Name</label>
                    <input type="text" id="cfg-owner" value="mr-na-09" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Repo Name</label>
                    <input type="text" id="cfg-repo" value="dube-xerox-dharni" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Personal Access Token (Fine-grained PAT)</label>
                    <input type="password" id="cfg-token" placeholder="Paste github_pat_..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs font-mono focus:border-amber-500 focus:outline-none">
                </div>
            </div>
            <button onclick="loadCurrentData()" class="mt-4 bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2 rounded-xl transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate"></i> Sync Data from GitHub
            </button>
        </div>

        <!-- Admin Tabs (School Style Layout) -->
        <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-800 pb-4">
            <button onclick="setTab('main')" class="tab-btn bg-amber-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition" data-target="main">Main & Hero</button>
            <button onclick="setTab('services')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="services">Services Manager</button>
            <button onclick="setTab('features')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="features">Features List</button>
            <button onclick="setTab('gallery')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="gallery">Photo Gallery</button>
            <button onclick="setTab('contact')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="contact">Contact & Timing</button>
        </div>

        <!-- Tab 1: Main & Hero -->
        <div id="tab-main" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6">
            <h3 class="text-base font-bold text-amber-400 border-b border-slate-800 pb-2">Main Page Content</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Shop Status</label>
                    <select id="inp-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs focus:border-amber-500 focus:outline-none">
                        <option value="Open">Open Now (Green Badge)</option>
                        <option value="Closed">Closed (Red Badge)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Shop Name</label>
                    <input type="text" id="inp-shopname" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tagline</label>
                    <input type="text" id="inp-tagline" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Hero Top Small Badge</label>
                    <input type="text" id="inp-herobadge" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Hero Main Heading (HTML allowed)</label>
                    <input type="text" id="inp-herotitle" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Hero Subtitle / Description</label>
                    <textarea id="inp-herodesc" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs"></textarea>
                </div>
            </div>
        </div>

        <!-- Tab 2: Services Manager -->
        <div id="tab-services" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400">All Services (Add/Edit/Delete)</h3>
                <button onclick="addService()" class="bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add New Service
                </button>
            </div>
            <div id="services-list" class="space-y-4"></div>
        </div>

        <!-- Tab 3: Features List -->
        <div id="tab-features" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400">Right Side Feature List</h3>
                <button onclick="addFeature()" class="bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add Feature Line
                </button>
            </div>
            <div id="features-list-admin" class="space-y-3"></div>
        </div>

        <!-- Tab 4: Photo Gallery -->
        <div id="tab-gallery" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400">Gallery Image Links</h3>
                <button onclick="addImage()" class="bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add Image URL
                </button>
            </div>
            <div id="gallery-list-admin" class="space-y-3"></div>
        </div>

        <!-- Tab 5: Contact & Timing -->
        <div id="tab-contact" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <h3 class="text-base font-bold text-amber-400 border-b border-slate-800 pb-2">Footer, Timing & Contact Settings</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">WhatsApp Phone Number</label>
                    <input type="text" id="inp-whatsapp" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Call Phone Number</label>
                    <input type="text" id="inp-phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                    <input type="text" id="inp-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Full Shop Address</label>
                    <input type="text" id="inp-address" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mon - Sat Timing</label>
                    <input type="text" id="inp-monsat" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Sunday Timing</label>
                    <input type="text" id="inp-sun" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Footer About Description</label>
                    <textarea id="inp-about" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs"></textarea>
                </div>
            </div>
        </div>

        <div id="status-message" class="mt-6 text-center text-sm font-semibold"></div>
    </div>

    <!-- Master Script -->

            timing_sun: "सुबह 9:00 - दोपहर 2:00",
            about: "हम आपके सभी प्रकार के सरकारी दस्तावेज़, ऑनलाइन फॉर्म और प्रिंटिंग आवश्यकताओं के लिए प्रतिबद्ध हैं।",

                "अर्जेंट पासपोर्ट साइज फोटो (5 मिनट में)",
                "आधार कार्ड, पैन कार्ड & ऑनलाइन फॉर्म"
            ],
            services: [
                { title: "सातबारा (7/12) & 8-अ", desc: "डिजिटल हस्ताक्षर वाला अधिकृत सातबारा और 8-अ तुरंत प्राप्त करें। केवल गट नंबर या सर्वे नंबर की आवश्यकता है।", badge: "ज़रूरी: गाँव का नाम व सर्वे नंबर", icon: "fa-solid fa-file-invoice", color: "text-amber-400", bg: "bg-amber-500/10" },
                { title: "अर्जेंट पासपोर्ट साइज़ फोटो", desc: "मात्र 5 मिनट में हाई-क्वालिटी स्टूडियो बैकग्राउंड के साथ अर्जेंट पासपोर्ट फोटो और डिजिटल कॉपी पाएं।", badge: "सुविधा: इंस्टेंट कटिंग & प्रिंट", icon: "fa-solid fa-camera-retro", color: "text-blue-400", bg: "bg-blue-500/10" },
                { title: "आधार कार्ड प्रिंट & सेवाएं", desc: "ई-आधार डाउनलोड, प्लास्टिक पीवीसी (PVC) आधार कार्ड प्रिंटिंग, और कलर कॉपी की सुविधा।", badge: "ज़रूरी: आधार नंबर / OTP", icon: "fa-solid fa-address-card", color: "text-emerald-400", bg: "bg-emerald-500/10" },

                { title: "ज़ेरॉक्स & कलर कॉपी", desc: "साधारण ब्लैक एंड व्हाइट ज़ेरॉक्स, हाई-डेफिनिशन कलर प्रिंट और प्रीमियम लेमिनेशन सेवा उपलब्ध है।", badge: "साइज: A4, Legal, A3", icon: "fa-solid fa-copy", color: "text-rose-400", bg: "bg-rose-500/10" },
                { title: "ऑनलाइन फॉर्म & आवेदन", desc: "सभी प्रकार के सरकारी जॉब फॉर्म, स्कॉलरशिप फॉर्म, कॉलेज एडमिशन और ई-जिला प्रमाण पत्र आवेदन।", badge: "सटीक एवं सुरक्षित फॉर्म फिलिंग", icon: "fa-solid fa-laptop-code", color: "text-cyan-400", bg: "bg-cyan-500/10" }
            ],
            gallery: [
                "https://images.unsplash.com/photo-1562654501-a0ccc0fc3fb1?auto=format&fit=crop&w=800&q=80",
                "https://images.unsplash.com/photo-1588600878108-578307a3cc9d?auto=format&fit=crop&w=800&q=80",
                "https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=800&q=80"
            ]
        };

        function setTab(name) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-amber-400', 'text-slate-950');
                btn.classList.add('bg-slate-900', 'text-slate-300');
                if(btn.dataset.target === name) {
                    btn.classList.remove('bg-slate-900', 'text-slate-300');
                    btn.classList.add('bg-amber-400', 'text-slate-950');
                }
            });
        }

        function populateForm() {
            document.getElementById('inp-status').value = db.status || "Open";
            document.getElementById('inp-shopname').value = db.shop_name || "";
            document.getElementById('inp-tagline').value = db.tagline || "";
            document.getElementById('inp-herobadge').value = db.hero_badge || "";
            document.getElementById('inp-herotitle').value = db.hero_title || "";
            document.getElementById('inp-herodesc').value = db.hero_desc || "";

            document.getElementById('inp-whatsapp').value = db.whatsapp || "";
            document.getElementById('inp-phone').value = db.phone || "";
            document.getElementById('inp-email').value = db.email || "";
            document.getElementById('inp-address').value = db.address || "";
            document.getElementById('inp-monsat').value = db.timing_monsat || "";
            document.getElementById('inp-sun').value = db.timing_sun || "";
            document.getElementById('inp-about').value = db.about || "";

            renderServices();
            renderFeatures();
            renderGallery();
        }

        function renderServices() {
            let html = '';
            (db.services || []).forEach((s, i) => {
                html += `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl relative space-y-3">
                    <button onclick="db.services.splice(${i},1); renderServices();" class="absolute top-3 right-3 text-rose-400 hover:text-rose-300 text-xs"><i class="fa-solid fa-trash"></i> Delete</button>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" value="${s.title}" oninput="db.services[${i}].title=this.value" placeholder="Title" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">
                        <input type="text" value="${s.badge}" oninput="db.services[${i}].badge=this.value" placeholder="Badge text" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">
                    </div>
                    <textarea oninput="db.services[${i}].desc=this.value" placeholder="Description" rows="2" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">${s.desc}</textarea>
                </div>`;
            });
            document.getElementById('services-list').innerHTML = html;
        }

        function addService() {
            if(!db.services) db.services = [];
            db.services.push({ title: "नई सर्विस", desc: "यहाँ सर्विस का विवरण लिखें", badge: "उपलब्ध", icon: "fa-solid fa-print", color: "text-amber-400", bg: "bg-amber-500/10" });
            renderServices();
        }

        function renderFeatures() {
            let html = '';
            (db.features || []).forEach((f, i) => {
                html += `
                <div class="flex items-center gap-2">
                    <input type="text" value="${f}" oninput="db.features[${i}]=this.value" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    <button onclick="db.features.splice(${i},1); renderFeatures();" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('features-list-admin').innerHTML = html;
        }

        function addFeature() {
            if(!db.features) db.features = [];
            db.features.push("नई विशेषता का विवरण");
            renderFeatures();
        }

        function renderGallery() {
            let html = '';
            (db.gallery || []).forEach((img, i) => {
                html += `
                <div class="flex items-center gap-3 bg-slate-950 border border-slate-800 p-2 rounded-xl">
                    <img src="${img}" class="w-12 h-12 object-cover rounded-lg">
                    <input type="text" value="${img}" oninput="db.gallery[${i}]=this.value" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">
                    <button onclick="db.gallery.splice(${i},1); renderGallery();" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('gallery-list-admin').innerHTML = html;
        }

        function addImage() {
            if(!db.gallery) db.gallery = [];
            db.gallery.push("https://images.unsplash.com/photo-1562654501-a0ccc0fc3fb1?auto=format&fit=crop&w=800&q=80");
            renderGallery();
        }

        async function loadCurrentData() {
            const owner = document.getElementById('cfg-owner').value.trim();
            const repo = document.getElementById('cfg-repo').value.trim();
            const token = document.getElementById('cfg-token').value.trim();
            const msg = document.getElementById('status-message');

            if(!token) { alert("GitHub Token daalna zaroori hai!"); return; }
            msg.innerText = "GitHub se data load ho raha hai...";

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if(res.ok) {
                    const info = await res.json();
                    db = JSON.parse(decodeURIComponent(escape(atob(info.content))));
                    populateForm();
                    msg.className = "mt-6 text-center text-sm font-semibold text-emerald-400";
                    msg.innerText = "Data successfully load ho gaya!";
                } else {
                    populateForm();
                    msg.className = "mt-6 text-center text-sm font-semibold text-amber-400";
                    msg.innerText = "data.json abhi tak nahi tha, naye data ke saath create karne ke liye Save button dabayein.";
                }
            } catch(e) {
                msg.className = "mt-6 text-center text-sm font-semibold text-rose-400";
                msg.innerText = "Error: " + e.message;
            }
        }

        async function saveAllToGitHub() {
            const owner = document.getElementById('cfg-owner').value.trim();
            const repo = document.getElementById('cfg-repo').value.trim();
            const token = document.getElementById('cfg-token').value.trim();
            const msg = document.getElementById('status-message');

            if(!token) { alert("Pehle GitHub Personal Access Token dalein!"); return; }

            // Collect Form Values
            db.status = document.getElementById('inp-status').value;
            db.shop_name = document.getElementById('inp-shopname').value;
            db.tagline = document.getElementById('inp-tagline').value;
            db.hero_badge = document.getElementById('inp-herobadge').value;
            db.hero_title = document.getElementById('inp-herotitle').value;
            db.hero_desc = document.getElementById('inp-herodesc').value;

            db.whatsapp = document.getElementById('inp-whatsapp').value;
            db.phone = document.getElementById('inp-phone').value;
            db.email = document.getElementById('inp-email').value;
            db.address = document.getElementById('inp-address').value;
            db.timing_monsat = document.getElementById('inp-monsat').value;
            db.timing_sun = document.getElementById('inp-sun').value;
            db.about = document.getElementById('inp-about').value;

            msg.className = "mt-6 text-center text-sm font-semibold text-amber-400";
            msg.innerText = "Changes GitHub par push ho rahe hain...";

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/data.json`;

            try {
                let sha = "";
                const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                if(getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const putRes = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Master Admin Update",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2)))),
                        sha: sha ? sha : undefined
                    })
                });

                if(putRes.ok) {
                    msg.className = "mt-6 text-center text-sm font-semibold text-emerald-400";
                    msg.innerText = "Awesome! Sabhi badlaav live save ho gaye!";
                } else {
                    const err = await putRes.json();
                    throw new Error(err.message || "Save failed");
                }
            } catch(e) {
                msg.className = "mt-6 text-center text-sm font-semibold text-rose-400";
                msg.innerText = "Error: " + e.message;
            }
        }

        populateForm();
    </script>
</body>
</html>
