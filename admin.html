<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-wrap justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8 shadow-2xl gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-400 rounded-2xl flex items-center justify-center text-slate-950 text-2xl font-black">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Xerox Shop Master Admin</h1>
                    <p class="text-xs text-slate-400">Website ki har ek cheez yahan se control karein</p>
                </div>
            </div>
            <button onclick="saveToGitHub()" class="bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold px-6 py-3 rounded-xl text-sm shadow-xl shadow-amber-400/20 transition flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> Save All to GitHub
            </button>
        </div>

        <!-- GitHub Config -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8">
            <h3 class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-4">GitHub Authentication</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Owner Name</label>
                    <input type="text" id="cfg-owner" value="mr-na-09" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Repo Name</label>
                    <input type="text" id="cfg-repo" value="dube-xerox-dharni" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Personal Access Token (PAT)</label>
                    <input type="password" id="cfg-token" placeholder="github_pat_..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs font-mono">
                </div>
            </div>
            <button onclick="loadFromGitHub()" class="mt-4 bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2 rounded-xl transition">
                <i class="fa-solid fa-rotate mr-1"></i> Sync Data from GitHub
            </button>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-800 pb-4">
            <button onclick="switchTab('main')" class="tab-btn bg-amber-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition" data-target="main">Main & Hero</button>
            <button onclick="switchTab('services')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="services">Services</button>
            <button onclick="switchTab('features')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="features">Features</button>
            <button onclick="switchTab('gallery')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="gallery">Gallery Photos</button>
            <button onclick="switchTab('contact')" class="tab-btn bg-slate-900 text-slate-300 font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition hover:bg-slate-800" data-target="contact">Contact & Timing</button>
        </div>

        <!-- Tab 1: Main & Hero -->
        <div id="tab-main" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6">
            <h3 class="text-base font-bold text-amber-400 border-b border-slate-800 pb-2">Main Details & Logo</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Shop Status Badge</label>
                    <select id="inp-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                        <option value="Open">Open Now (Green)</option>
                        <option value="Closed">Closed Now (Red)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Shop Name</label>
                    <input type="text" id="inp-shopname" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Shop Logo (Computer se File Select karein)</label>
                    <div class="flex items-center gap-4">
                        <input type="file" id="inp-logo-file" accept="image/*" onchange="uploadLogoFile(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-400 file:text-slate-950 hover:file:bg-amber-500 cursor-pointer">
                    </div>
                    <input type="hidden" id="inp-logo">
                    <div id="logo-preview-box" class="mt-2 text-xs text-emerald-400 font-semibold"></div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tagline</label>
                    <input type="text" id="inp-tagline" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Hero Top Badge Text</label>
                    <input type="text" id="inp-herobadge" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Hero Main Heading (HTML allowed)</label>
                    <input type="text" id="inp-herotitle" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Hero Description</label>
                    <textarea id="inp-herodesc" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs"></textarea>
                </div>
            </div>
        </div>

        <!-- Tab 2: Services -->
        <div id="tab-services" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400">Manage Services</h3>
                <button onclick="addService()" class="bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add Service
                </button>
            </div>
            <div id="services-admin-list" class="space-y-4"></div>
        </div>

        <!-- Tab 3: Features -->
        <div id="tab-features" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400">Manage Right Box Features</h3>
                <button onclick="addFeature()" class="bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add Feature
                </button>
            </div>
            <div id="features-admin-list" class="space-y-3"></div>
        </div>

        <!-- Tab 4: Gallery -->
        <div id="tab-gallery" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400">Manage Gallery Photos (Computer se Upload karein)</h3>
                <button onclick="addImageUrl()" class="bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add Gallery Box
                </button>
            </div>
            <div id="gallery-admin-list" class="space-y-4"></div>
        </div>

        <!-- Tab 5: Contact & Timing -->
        <div id="tab-contact" class="tab-content bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 hidden">
            <h3 class="text-base font-bold text-amber-400 border-b border-slate-800 pb-2">Footer & Contact Info</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">WhatsApp Number</label>
                    <input type="text" id="inp-whatsapp" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Phone Number</label>
                    <input type="text" id="inp-phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
                    <input type="text" id="inp-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Address</label>
                    <input type="text" id="inp-address" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mon - Sat Timing</label>
                    <input type="text" id="inp-monsat" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Sunday Timing</label>
                    <input type="text" id="inp-sun" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Footer About Text</label>
                    <textarea id="inp-about" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs"></textarea>
                </div>
            </div>
        </div>

        <div id="status-msg" class="mt-6 text-center text-sm font-semibold"></div>
    </div>

    <script>
        let db = {
            status: "Open",
            shop_name: "डिजिटल ज़ेरॉक्स & ऑनलाइन",
            logo_url: "",
            tagline: "Fast & Reliable Services",
            hero_badge: "धारणी की सबसे तेज डिजिटल सेवा दुकान",
            hero_title: "सभी प्रकार के <span class='text-amber-400'>सरकारी दस्तावेज़</span> और प्रिंटिंग अब तुरंत!",
            hero_desc: "सातबारा, 8-अ, अर्जेंट पासपोर्ट फोटो, आधार कार्ड प्रिंट, मोबाइल PDF प्रिंट, और हाई-क्वालिटी कलर ज़ेरॉक्स बिना किसी लाइन के मिनटों में पाएं।",
            whatsapp: "919876543210",
            phone: "+91 98765 43210",
            email: "support@digitalxerox.in",
            address: "मुख्य मार्ग, धारणी, जिला अमरावती, महाराष्ट्र",
            timing_monsat: "सुबह 8:00 - रात 8:30",
            timing_sun: "सुबह 9:00 - दोपहर 2:00",
            about: "हम आपके सभी प्रकार के सरकारी दस्तावेज़, ऑनलाइन फॉर्म और प्रिंटिंग आवश्यकताओं के लिए प्रतिबद्ध हैं।",
            features: [
                "सातबारा (7/12) एवं 8-अ तुरंत डिजिटल प्रिंट",
                "व्हाट्सएप पर PDF भेजकर तुरंत प्रिंट पाएं",
                "अर्जेंट पासपोर्ट साइज फोटो (5 मिनट में)",
                "आधार कार्ड, पैन कार्ड & ऑनलाइन फॉर्म"
            ],
            services: [
                { title: "सातबारा (7/12) & 8-अ", desc: "डिजिटल हस्ताक्षर वाला अधिकृत सातबारा और 8-अ तुरंत प्राप्त करें। केवल गट नंबर या सर्वे नंबर की आवश्यकता है।", badge: "ज़रूरी: गाँव का नाम व सर्वे नंबर", icon: "fa-solid fa-file-invoice" },
                { title: "अर्जेंट पासपोर्ट साइज़ फोटो", desc: "मात्र 5 मिनट में हाई-क्वालिटी स्टूडियो बैकग्राउंड के साथ अर्जेंट पासपोर्ट फोटो और डिजिटल कॉपी पाएं।", badge: "सुविधा: इंस्टेंट कटिंग & प्रिंट", icon: "fa-solid fa-camera-retro" },
                { title: "आधार कार्ड प्रिंट & सेवाएं", desc: "ई-आधार डाउनलोड, प्लास्टिक पीवीसी (PVC) आधार कार्ड प्रिंटिंग, और कलर कॉपी की सुविधा।", badge: "ज़रूरी: आधार नंबर / OTP", icon: "fa-solid fa-address-card" }
            ],
            gallery: [
                "https://images.unsplash.com/photo-1562654501-a0ccc0fc3fb1?auto=format&fit=crop&w=800&q=80",
                "https://images.unsplash.com/photo-1588600878108-578307a3cc9d?auto=format&fit=crop&w=800&q=80"
            ]
        };

        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-amber-400', 'text-slate-950');
                btn.classList.add('bg-slate-900', 'text-slate-300');
                if(btn.dataset.target === name) {
                    btn.classList.remove('bg-slate-900', 'text-slate-300');
                    btn.classList.add('bg-amber-400', 'text-slate-950');
                }
            });
        }

        function uploadLogoFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('inp-logo').value = e.target.result;
                    db.logo_url = e.target.result;
                    document.getElementById('logo-preview-box').innerText = "✔ Logo successfully attached from computer!";
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function uploadGalleryFile(input, i) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    db.gallery[i] = e.target.result;
                    renderGallery();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function populate() {
            document.getElementById('inp-status').value = db.status || "Open";
            document.getElementById('inp-shopname').value = db.shop_name || "";
            document.getElementById('inp-logo').value = db.logo_url || "";
            if(db.logo_url) {
                document.getElementById('logo-preview-box').innerText = "✔ Logo already loaded.";
            }
            document.getElementById('inp-tagline').value = db.tagline || "";
            document.getElementById('inp-herobadge').value = db.hero_badge || "";
            document.getElementById('inp-herotitle').value = db.hero_title || "";
            document.getElementById('inp-herodesc').value = db.hero_desc || "";
            document.getElementById('inp-whatsapp').value = db.whatsapp || "";
            document.getElementById('inp-phone').value = db.phone || "";
            document.getElementById('inp-email').value = db.email || "";
            document.getElementById('inp-address').value = db.address || "";
            document.getElementById('inp-monsat').value = db.timing_monsat || "";
            document.getElementById('inp-sun').value = db.timing_sun || "";
            document.getElementById('inp-about').value = db.about || "";

            renderServices();
            renderFeatures();
            renderGallery();
        }

        function renderServices() {
            let html = '';
            (db.services || []).forEach((s, i) => {
                html += `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl relative space-y-3">
                    <button onclick="db.services.splice(${i},1); renderServices();" class="absolute top-3 right-3 text-rose-400 text-xs"><i class="fa-solid fa-trash"></i> Delete</button>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" value="${s.title}" oninput="db.services[${i}].title=this.value" placeholder="Title" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">
                        <input type="text" value="${s.badge}" oninput="db.services[${i}].badge=this.value" placeholder="Badge" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">
                    </div>
                    <textarea oninput="db.services[${i}].desc=this.value" rows="2" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">${s.desc}</textarea>
                </div>`;
            });
            document.getElementById('services-admin-list').innerHTML = html;
        }

        function addService() {
            if(!db.services) db.services = [];
            db.services.push({ title: "New Service", desc: "Service description here", badge: "Available", icon: "fa-solid fa-print" });
            renderServices();
        }

        function renderFeatures() {
            let html = '';
            (db.features || []).forEach((f, i) => {
                html += `
                <div class="flex items-center gap-2">
                    <input type="text" value="${f}" oninput="db.features[${i}]=this.value" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs">
                    <button onclick="db.features.splice(${i},1); renderFeatures();" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('features-admin-list').innerHTML = html;
        }

        function addFeature() {
            if(!db.features) db.features = [];
            db.features.push("New Feature line");
            renderFeatures();
        }

        function renderGallery() {
            let html = '';
            (db.gallery || []).forEach((img, i) => {
                html += `
                <div class="flex flex-col sm:flex-row items-center gap-3 bg-slate-950 border border-slate-800 p-3 rounded-xl">
                    <img src="${img}" class="w-16 h-16 object-cover rounded-lg border border-slate-800">
                    <div class="flex-1 w-full space-y-1">
                        <label class="block text-[10px] text-slate-400">Computer se nayi photo select karein:</label>
                        <input type="file" accept="image/*" onchange="uploadGalleryFile(this, ${i})" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-400 file:text-slate-950 cursor-pointer">
                    </div>
                    <button onclick="db.gallery.splice(${i},1); renderGallery();" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('gallery-admin-list').innerHTML = html;
        }

        function addImageUrl() {
            if(!db.gallery) db.gallery = [];
            db.gallery.push("https://images.unsplash.com/photo-1562654501-a0ccc0fc3fb1?auto=format&fit=crop&w=800&q=80");
            renderGallery();
        }

        async function loadFromGitHub() {
            const owner = document.getElementById('cfg-owner').value.trim();
            const repo = document.getElementById('cfg-repo').value.trim();
            const token = document.getElementById('cfg-token').value.trim();
            const msg = document.getElementById('status-msg');

            if(!token) { alert("Token zaroori hai!"); return; }
            msg.innerText = "Loading...";

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if(res.ok) {
                    const info = await res.json();
                    db = JSON.parse(decodeURIComponent(escape(atob(info.content))));
                    populate();
                    msg.className = "mt-6 text-center text-sm font-semibold text-emerald-400";
                    msg.innerText = "Loaded successfully!";
                } else {
                    populate();
                    msg.className = "mt-6 text-center text-sm font-semibold text-amber-400";
                    msg.innerText = "data.json not found, defaults loaded.";
                }
            } catch(e) {
                msg.className = "mt-6 text-center text-sm font-semibold text-rose-400";
                msg.innerText = "Error: " + e.message;
            }
        }

        async function saveToGitHub() {
            const owner = document.getElementById('cfg-owner').value.trim();
            const repo = document.getElementById('cfg-repo').value.trim();
            const token = document.getElementById('cfg-token').value.trim();
            const msg = document.getElementById('status-msg');

            if(!token) { alert("Pehle GitHub Token daalein!"); return; }

            db.status = document.getElementById('inp-status').value;
            db.shop_name = document.getElementById('inp-shopname').value;
            db.logo_url = document.getElementById('inp-logo').value;
            db.tagline = document.getElementById('inp-tagline').value;
            db.hero_badge = document.getElementById('inp-herobadge').value;
            db.hero_title = document.getElementById('inp-herotitle').value;
            db.hero_desc = document.getElementById('inp-herodesc').value;
            db.whatsapp = document.getElementById('inp-whatsapp').value;
            db.phone = document.getElementById('inp-phone').value;
            db.email = document.getElementById('inp-email').value;
            db.address = document.getElementById('inp-address').value;
            db.timing_monsat = document.getElementById('inp-monsat').value;
            db.timing_sun = document.getElementById('inp-sun').value;
            db.about = document.getElementById('inp-about').value;

            msg.className = "mt-6 text-center text-sm font-semibold text-amber-400";
            msg.innerText = "Saving to GitHub...";

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/data.json`;

            try {
                let sha = "";
                const getRes = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                if(getRes.ok) {
                    const info = await getRes.json();
                    sha = info.sha;
                }

                const putRes = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Add File Upload Support",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2)))),
                        sha: sha ? sha : undefined
                    })
                });

                if(putRes.ok) {
                    msg.className = "mt-6 text-center text-sm font-semibold text-emerald-400";
                    msg.innerText = "Success! Files & changes saved to GitHub!";
                } else {
                    const err = await putRes.json();
                    throw new Error(err.message || "Failed");
                }
            } catch(e) {
                msg.className = "mt-6 text-center text-sm font-semibold text-rose-400";
                msg.innerText = "Error: " + e.message;
            }
        }

        populate();
    </script>
</body>
</html>
